services:
  postgres:
    image: postgres:18.3
    container_name: postgres-club
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: adminUser123
      POSTGRES_DB: club_deportivo

    ports:
      - "5432:5432"

    volumes:
      - postgres18_data:/var/lib/postgresql

volumes:
  postgres18_data:

