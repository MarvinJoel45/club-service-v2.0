version: 0.2

env:
  variables:
    APP_NAME: club-service
    JAR_NAME: club-service-v1.0.0.jar

phases:
  install:
    runtime-versions:
      java: corretto21
    commands:
      - echo "Installing dependencies"
      - mvn --version

  pre_build:
    commands:
      - echo "Cleaning project"
      - mvn clean
      - echo "Downloading Maven dependencies"
      - mvn dependency:go-offline -B

  build:
    commands:
      - echo "Packaging application"
      - mvn package -DskipTests

  post_build:
    commands:
      - echo "Preparing deployment package"

      # crear carpeta deploy
      - mkdir -p deploy

      # copiar jar final
      - cp target/$JAR_NAME deploy/

      # copiar appspec
      - cp appspec.yml deploy/

      # copiar scripts
      - cp -r aws deploy/

      - echo "Deployment package content:"
      - ls -R deploy/

artifacts:
  files:
    - '**/*'
  base-directory: deploy

cache:
  paths:
    - '/root/.m2/**/*'