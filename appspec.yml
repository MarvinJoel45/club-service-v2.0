version: 0.0
os: linux

files:
  - source: .
    destination: /opt/club-service

hooks:

  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 60

  BeforeInstall:
    - location: scripts/load-env.sh
      timeout: 60

  AfterInstall:
    - location: scripts/install.sh
      timeout: 60

  ApplicationStart:
    - location: scripts/start.sh
      timeout: 60