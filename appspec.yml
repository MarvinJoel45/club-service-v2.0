version: 0.0
os: linux

files:
  - source: /club-service-v1.0.0.jar
    destination: /home/ubuntu/club-service

  - source: /aws
    destination: /home/ubuntu/club-service

permissions:
  - object: /home/ubuntu/club-service
    owner: ubuntu
    group: ubuntu
    mode: 755

hooks:
  BeforeInstall:
    - location: aws/scripts/stop.sh
      timeout: 60
      runas: ubuntu

  ApplicationStart:
    - location: aws/scripts/start.sh
      timeout: 60
      runas: ubuntu